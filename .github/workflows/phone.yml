name: phone

# The Android app (apps/phone): a release build with its JavaScript bundled, kept as an artifact, and
# the app on an Android 10 emulator against the real service (pnpm phone-emulator). It runs when the
# app or what it shares with the computer changes.
#
# Gradle signs with the template's throwaway key, for this job's own tests. Only a build of main
# that passed the emulator is signed again with the owner's key, when the repository has it
# (TTASKS_ANDROID_KEYSTORE_BASE64 and TTASKS_ANDROID_KEYSTORE_PASSWORD), by apksigner alone: no
# pull request and no dependency's code sees the key. That APK installs over the last one and the
# phone stays paired; every other artifact is named a test build, not for a phone.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &paths
      - apps/phone/**
      - packages/brand/**
      - packages/client/**
      - packages/contracts/**
      - packages/service/src/link/**
      - tests/phone/**
      - pnpm-lock.yaml
      - .github/workflows/phone.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: phone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: android (build and emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Gradle runs `node` itself (Expo's autolinking and the JavaScript bundle): the same Node 26
      # that pnpm runs the scripts with.
      - run: pnpm --silent exec node -p "require('node:path').dirname(process.execPath)" >> "$GITHUB_PATH"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # basic: the action's MIT cache, not its default commercial one.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Prebuild
        working-directory: apps/phone
        env:
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build the release APK and the installed-app test
        working-directory: apps/phone/android
        run: ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest -PreactNativeArchitectures=arm64-v8a,x86_64

      # One OkHttp: the one React Native ships, which the link module compiles against.
      - name: OkHttp on the release runtime classpath
        working-directory: apps/phone/android
        run: |
          ./gradlew -q :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency com.squareup.okhttp3:okhttp | tee "$RUNNER_TEMP/okhttp.txt"
          { echo '### OkHttp on the release runtime classpath'; echo '```'; cat "$RUNNER_TEMP/okhttp.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The app on an Android 10 emulator against the real service
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: pnpm phone-emulator --app apps/phone/android/app/build/outputs/apk/release/app-release.apk --test apps/phone/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk

      - name: Signed with the owner's key (main only, after the emulator passed)
        id: sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE: ${{ secrets.TTASKS_ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.TTASKS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] || exit 0
          apk=apps/phone/android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ttasks.p12"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/ttasks.p12" --ks-type PKCS12 --ks-key-alias ttasks --ks-pass env:PASSWORD --key-pass env:PASSWORD "$apk"
          rm "$RUNNER_TEMP/ttasks.p12"
          "$tools/apksigner" verify "$apk"
          echo "artifact=ttasks-android" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.sign.outputs.artifact || 'ttasks-android-test-build' }}
          path: apps/phone/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
