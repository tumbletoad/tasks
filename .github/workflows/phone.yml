name: phone

# The Android app (apps/phone): a release build with its JavaScript bundled, kept as an artifact, and
# the app on an Android 10 emulator against the real service (pnpm phone-emulator). It runs when the
# app or what it shares with the computer changes.
#
# The APK is signed with the owner's key when the repository has it (TTASKS_ANDROID_KEYSTORE_BASE64
# and TTASKS_ANDROID_KEYSTORE_PASSWORD), so a new build installs over the old one and the phone stays
# paired. Without it the build is signed with a throwaway key and named a test build: it is for
# this job's own tests, not for a phone.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &paths
      - apps/phone/**
      - packages/brand/**
      - packages/client/**
      - packages/contracts/**
      - packages/service/src/link/**
      - tests/phone/**
      - pnpm-lock.yaml
      - .github/workflows/phone.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: phone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: android (build and emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Gradle runs `node` itself (Expo's autolinking and the JavaScript bundle): the same Node 26
      # that pnpm runs the scripts with.
      - run: pnpm --silent exec node -p "require('node:path').dirname(process.execPath)" >> "$GITHUB_PATH"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: The owner's signing key, when the repository has it
        id: key
        env:
          KEYSTORE: ${{ secrets.TTASKS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ttasks.p12"
            echo "TTASKS_ANDROID_KEYSTORE=$RUNNER_TEMP/ttasks.p12" >> "$GITHUB_ENV"
            echo "artifact=ttasks-android" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=ttasks-android-test-build" >> "$GITHUB_OUTPUT"
          fi

      - name: Prebuild
        working-directory: apps/phone
        env:
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build the release APK and the installed-app test
        working-directory: apps/phone/android
        env:
          TTASKS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TTASKS_ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest -PreactNativeArchitectures=arm64-v8a,x86_64

      # One OkHttp: the one React Native ships, which the link module compiles against.
      - name: OkHttp on the release runtime classpath
        working-directory: apps/phone/android
        run: |
          ./gradlew -q :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency com.squareup.okhttp3:okhttp | tee "$RUNNER_TEMP/okhttp.txt"
          { echo '### OkHttp on the release runtime classpath'; echo '```'; cat "$RUNNER_TEMP/okhttp.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.key.outputs.artifact }}
          path: apps/phone/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The app on an Android 10 emulator against the real service
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: pnpm phone-emulator --app apps/phone/android/app/build/outputs/apk/release/app-release.apk --test apps/phone/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
