name: diag

# TEMPORARY: facts about the hosted runners for the check job's failures. Removed before merging.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: diag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: diag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: cp .github/diag/diag.ts.txt .github/diag/diag.ts && pnpm exec node .github/diag/diag.ts
      - continue-on-error: true
        run: pnpm exec vitest run --project product --reporter=verbose packages/storage/test/write-model.test.ts packages/testkit/src/mira.test.ts packages/service/test/sync-host.test.ts packages/launch/test/environment.test.ts
