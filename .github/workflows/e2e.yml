name: e2e

# The browser tests (pnpm e2e: the real service and the built page, in Chromium and Firefox) on
# every pull request that is not a draft and on every push to main, as check.yml runs verify. They
# run on Linux and Windows, each browser in a job of its own.
# The job named "e2e" passes only when all of them did: it is the one to read.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A draft's run does nothing and has a group of its own, so that it never cancels the run that
# starts when the pull request is marked ready a moment after a push.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  browsers:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: pnpm e2e --project ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # The browsers belong to the Playwright version in the lockfile: a new version is a new key.
      - id: playwright
        shell: bash
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Playwright's own browser folder on each OS.
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      # The cache holds the browsers, not the system libraries they need on Linux: those come
      # from apt. It is saved right after the download, so a run whose tests fail still fills it.
      - if: steps.browsers.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit != 'true' && runner.os != 'Linux'
        run: pnpm exec playwright install ${{ matrix.browser }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      # Under umask 002 on Linux, as check.yml runs verify: a desktop with user private groups.
      - if: runner.os == 'Linux'
        run: umask 002 && pnpm e2e --project ${{ matrix.browser }}
      - if: runner.os != 'Linux'
        run: pnpm e2e --project ${{ matrix.browser }}

      # The tests use invented data only, so the report, traces and screenshots hold no one's tasks.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            tests/e2e/report/
            tests/e2e/results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/gate.sh
          sparse-checkout-cone-mode: false
      # 4 is the number of test jobs: one added or removed without changing it fails the gate.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/gate.sh e2e 4
