name: check

# A draft pull request runs nothing: drafts are pushed to many times a day, and a run on each push
# would only queue. A pull request is checked when it is opened ready, marked ready, and on every
# push after that. Main is checked on every push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The lab tests run one file at a time when they run (scripts/lab-tests.ts), which is slower
    # than the old parallel run on a quiet runner but cannot time out under load. On windows-2025
    # a verify that runs them takes about 31 minutes; install and the crash run's 5 minutes come
    # on top (A7 3.18.1), so a pull request that changes a lab file (the lockfile is one) needs 45.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pnpm verify runs the lab tests only when lab files changed since the base
          # (scripts/lab-tests.ts). Depth 2 holds HEAD and its parents: on a pull request the merge
          # commit's first parent is the base branch tip. On a push the base is the commit the
          # ref pointed at before, from the event: after a merged pull request that is HEAD's
          # first parent. A base that is missing here makes verify run the lab tests anyway.
          fetch-depth: 2

      # pnpm comes from packageManager in package.json. pnpm install then downloads Node 26.13.1
      # from devEngines.runtime, checked against the lockfile, and every pnpm script runs on it.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # The run-container tests need real cgroups: transient systemd user units with Delegate=yes,
      # as the service's own unit has. They make such units only where this variable says the user
      # manager is the runner's own, never in a person's session
      # (packages/runs/test/stand-ins/service.ts). Linger starts the runner user's manager.
      - if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 100); do
            [ -S "/run/user/$(id -u)/systemd/private" ] && break
            sleep 0.1
          done
          echo "TASKS_TEST_USER_UNITS=1" >> "$GITHUB_ENV"

      # Linux runs verify under umask 002, the default of a desktop with user private groups
      # (Ubuntu, Fedora), where every file a person or a test makes is group-writable. The runners'
      # own 022 hid a class of failures there: a file made without an explicit mode that the
      # service's permission check then refuses (A2 3.2.2 rule 5).
      # The umask guard test covers 000 and 077 itself. Windows has no umask.
      - if: runner.os == 'Linux'
        run: umask 002 && pnpm verify
      - if: runner.os != 'Linux'
        run: pnpm verify

      # The 5-minute crash run per PR (A7 3.18.1, 3.18.4). Not part of verify, whose own slice of
      # it takes seconds; the 30-minute run is the nightly workflow's.
      - run: pnpm crash --minutes 5
