name: check

# pnpm verify and the 5-minute crash run, on Linux and Windows, spread over parallel jobs so a pull
# request has its answer in about ten minutes: the static checks, the product tests and the lab
# tests in shards (a lab job skips when verify's rule skips the lab tests) and the crash run. Each
# job's name is the command that repeats it locally. The job named "check" passes only when all
# of them did: it is the one to read.
#
# A draft pull request runs nothing: drafts are pushed to many times a day, and a run on each push
# would only queue. A pull request is checked when it is opened ready, marked ready, and on every
# push after that. Main is checked on every push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A draft's run does nothing and has a group of its own, so that it never cancels the run that
# starts when the pull request is marked ready a moment after a push.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  part:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: pnpm ${{ matrix.run }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows is about twice as slow, so it gets more shards: on windows-2025 the longest
        # product test file takes about 3.5 minutes and the longest lab test file 4. Each job takes
        # a runner, and the account's runners are shared by every open pull request, so a shard
        # that would save little is not worth one.
        include:
          - { os: ubuntu-24.04, run: verify --part checks }
          - { os: ubuntu-24.04, run: verify --part product --shard 1/3 }
          - { os: ubuntu-24.04, run: verify --part product --shard 2/3 }
          - { os: ubuntu-24.04, run: verify --part product --shard 3/3 }
          - { os: ubuntu-24.04, run: verify --part lab }
          # Not part of verify, whose own slice of it takes seconds; the 30-minute run is the
          # nightly workflow's.
          - { os: ubuntu-24.04, run: crash --minutes 5 }
          - { os: windows-2025, run: verify --part checks }
          - { os: windows-2025, run: verify --part product --shard 1/4 }
          - { os: windows-2025, run: verify --part product --shard 2/4 }
          - { os: windows-2025, run: verify --part product --shard 3/4 }
          - { os: windows-2025, run: verify --part product --shard 4/4 }
          - { os: windows-2025, run: verify --part lab --shard 1/3 }
          - { os: windows-2025, run: verify --part lab --shard 2/3 }
          - { os: windows-2025, run: verify --part lab --shard 3/3 }
          - { os: windows-2025, run: crash --minutes 5 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pnpm verify runs the lab tests only when lab files changed since the base
          # (scripts/lab-tests.ts). Depth 2 holds HEAD and its parents: on a pull request the merge
          # commit's first parent is the base branch tip. On a push the base is the commit the
          # ref pointed at before, from the event: after a merged pull request that is HEAD's
          # first parent. A base that is missing here makes verify run the lab tests anyway.
          fetch-depth: 2

      # pnpm comes from packageManager in package.json. pnpm install then downloads Node 26.13.1
      # from devEngines.runtime, checked against the lockfile, and every pnpm script runs on it.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # The run-container tests need real cgroups: transient systemd user units with Delegate=yes,
      # as the service's own unit has. They make such units only where this variable says the user
      # manager is the runner's own, never in a person's session
      # (packages/runs/test/stand-ins/service.ts). Linger starts the runner user's manager.
      - if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 100); do
            [ -S "/run/user/$(id -u)/systemd/private" ] && break
            sleep 0.1
          done
          echo "TTASKS_TEST_USER_UNITS=1" >> "$GITHUB_ENV"

      # Linux runs verify under umask 002, the default of a desktop with user private groups
      # (Ubuntu, Fedora), where every file a person or a test makes is group-writable. The runners'
      # own 022 hid a class of failures there: a file made without an explicit mode that the
      # service's permission check then refuses (A2 3.2.2 rule 5).
      # The umask guard test covers 000 and 077 itself. Windows has no umask.
      - if: runner.os == 'Linux' && startsWith(matrix.run, 'verify')
        run: umask 002 && pnpm ${{ matrix.run }}
      - if: runner.os != 'Linux' || !startsWith(matrix.run, 'verify')
        run: pnpm ${{ matrix.run }}

  check:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: part
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/gate.sh
          sparse-checkout-cone-mode: false
      # 15 is the number of part jobs: one added or removed without changing it fails the gate.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/gate.sh check 15
